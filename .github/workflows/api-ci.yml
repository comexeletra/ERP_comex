name: API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: import_erp_ci
          POSTGRES_USER: import_erp_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U import_erp_ci -d import_erp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATION_ENV: isolated
      MIGRATION_DATABASE_URL: postgresql://import_erp_ci:ci-only-password@127.0.0.1:5432/import_erp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate
      - name: Install locked dependencies
        working-directory: apps/api
        run: corepack pnpm install --frozen-lockfile
      - name: Build API
        working-directory: apps/api
        run: corepack pnpm build
      - name: Run API authorization tests
        working-directory: apps/api
        run: corepack pnpm test
      - name: Confirm empty migration ledger
        working-directory: apps/api
        shell: bash
        run: |
          output="$(corepack pnpm migrate:status)"
          printf '%s\n' "$output"
          grep -Fq 'Migrations: 0 aplicadas, 7 pendentes.' <<< "$output"
      - name: Apply migrations to isolated PostgreSQL
        working-directory: apps/api
        run: corepack pnpm migrate:up
      - name: Confirm all migrations applied
        working-directory: apps/api
        shell: bash
        run: |
          output="$(corepack pnpm migrate:status)"
          printf '%s\n' "$output"
          grep -Fq 'Migrations: 7 aplicadas, 0 pendentes.' <<< "$output"
      - name: Confirm migration rerun is idempotent
        working-directory: apps/api
        shell: bash
        run: |
          output="$(corepack pnpm migrate:up)"
          printf '%s\n' "$output"
          grep -Fq 'Concluído: 0 migration(s) aplicada(s).' <<< "$output"
